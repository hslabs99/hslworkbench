# Firebase App Hosting — Vite + React SPA (static build + /api routes on Cloud Run).
# Not Next.js: build produces dist/; start must listen on PORT (injected as 8080).

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME

  # OpenAI — server-side only (RUNTIME). Create secret first:
  #   firebase apphosting:secrets:set openaiApiKey
  #   firebase apphosting:secrets:grantaccess openaiApiKey
  - variable: OPENAI_API_KEY
    secret: openaiApiKey
    availability:
      - RUNTIME

  - variable: OPENAI_MODEL
    value: gpt-4o-mini
    availability:
      - RUNTIME

  # Microsoft sign-in (Vite inlines VITE_* at BUILD; server also serves /api/ms-config at RUNTIME)
  - variable: VITE_MS_TENANT_ID
    value: 78147069-d2a8-43c7-b8b1-67e544b8f893
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_MS_CLIENT_ID
    value: 9aa8f5a2-d92a-460a-86c4-3c7fcde11f40
    availability:
      - BUILD
      - RUNTIME

  # Firebase — server-side only (RUNTIME). Vite must not see VITE_FIREBASE_* or it inlines keys in the browser.
  - variable: FIREBASE_API_KEY
    value: AIzaSyCZC4q8OyDder_ZF833Y9v7-leElHxrDko
    availability:
      - RUNTIME

  - variable: FIREBASE_AUTH_DOMAIN
    value: hslworkbench.firebaseapp.com
    availability:
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: hslworkbench
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: hslworkbench.firebasestorage.app
    availability:
      - RUNTIME

  - variable: FIREBASE_MESSAGING_SENDER_ID
    value: '5252692405'
    availability:
      - RUNTIME

  - variable: FIREBASE_APP_ID
    value: '1:5252692405:web:1f2531c0159ca36c1f01fc'
    availability:
      - RUNTIME

  # Optional — if omitted, msalConfig uses {origin}/auth/microsoft/callback at runtime
  # - variable: VITE_MS_REDIRECT_URI
  #   value: https://hslworkbench--hslworkbench.asia-southeast1.hosted.app/auth/microsoft/callback
  #   availability:
  #     - BUILD

  # SendGrid — API key is a secret (RUNTIME). Create and grant first:
  #   firebase apphosting:secrets:set sendgridApiKey
  #   firebase apphosting:secrets:grantaccess sendgridApiKey
  - variable: SENDGRID_API_KEY
    secret: sendgridApiKey
    availability:
      - RUNTIME

  - variable: SENDGRID_FROM_EMAIL
    value: mike@xlsexperts.co.nz
    availability:
      - RUNTIME

  - variable: SENDGRID_FROM_NAME
    value: XLS Experts
    availability:
      - RUNTIME

  - variable: SENDGRID_TEST_RECIPIENT
    value: mike@xlsexperts.co.nz
    availability:
      - RUNTIME
